<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>실제 서비스 A / 캐릭터 B 전체 화면</title><style>*{box-sizing:border-box}body{margin:0;padding:32px;background:#eeedeb;color:#222;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}header{max-width:1280px;margin:auto}h1{font-size:26px;letter-spacing:-.9px;line-height:1.4;margin:0 0 10px}header p{font-size:13px;line-height:1.8;color:#666;margin:0}.live{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.live a{font-size:12px;color:#222;text-underline-offset:4px}.toolbar{display:flex;gap:16px;align-items:center;margin:25px 0;padding-bottom:20px;border-bottom:1px solid #d5d5cf;font-size:12px;flex-wrap:wrap}.toolbar label{display:flex;align-items:center;gap:9px}select,button{font:inherit;font-size:12px;min-height:38px;padding:8px 12px;background:#fff;border:1px solid #ccc;border-radius:5px;color:#222}button{cursor:pointer}button[aria-pressed=true]{color:#fff;background:#222;border-color:#222}a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid #213f9b;outline-offset:4px}.screens{max-width:920px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:40px}figure{margin:0;min-width:0}figcaption{max-width:390px;margin:0 auto 14px;font-size:17px;font-weight:600;line-height:1.5}figcaption small{display:block;font-size:12px;color:#666;font-weight:400;margin-top:5px}.image-link{display:block;max-width:390px;margin:auto;background:#fff}.image-link img{width:100%;height:auto;display:block}.screens.pc{max-width:1500px;gap:24px}.screens.pc figcaption,.screens.pc .image-link{max-width:none}.note{max-width:1280px;margin:25px auto 0;font-size:11px;color:#777;line-height:1.8}.note a{color:#444;text-underline-offset:3px}@media(max-width:820px){body{padding:24px 18px}.screens{grid-template-columns:1fr;gap:32px}.screens.pc{grid-template-columns:1fr}h1{font-size:22px}.toolbar{gap:12px}}
</style></head><body><header><h1>A는 현재 서비스 그대로.<br>B는 캐릭터 중심으로 전체 화면 개편.</h1><p>실제 앱의 같은 기능과 데이터를 두 디자인으로 확인합니다. 로그인 전 흰 바탕·검정 궁서 화면은 공통 유지합니다.</p><nav class="live"><a href="http://localhost:3100/design-review">실제 서비스에서 A/B 선택하기 ↗</a><a href="http://localhost:3100/dashboard?design=b">캐릭터 B 바로 열기 ↗</a><a href="board.html">B 전체 화면 한눈에 보기 ↗</a></nav><div class="toolbar"><label>화면 <select id="screen"><option value="home">홈</option><option value="onboarding">사주 입력</option><option value="survey">기질 검사</option><option value="saju">사주 풀이</option><option value="fusion">통합 풀이</option><option value="consult">용신상담</option><option value="family">가족</option><option value="account">마이</option></select></label><div><button id="mobile" aria-pressed="true">모바일</button> <button id="pc" aria-pressed="false">PC</button></div></div></header><main class="screens" id="screens"><figure><figcaption>TYPE A · 현재 실제 서비스<small>기존 제목·표면·배치·기능 보존</small></figcaption><a class="image-link" id="a-link" href="screenshots/a-home-390.png"><img id="a-image" src="screenshots/a-home-390.png" alt="현재 서비스 A 홈"></a></figure><figure><figcaption>TYPE B · 캐릭터 중심 개편<small>홈부터 입력·검사·풀이·상담까지 같은 두 인물</small></figcaption><a class="image-link" id="b-link" href="screenshots/b-home-390.png"><img id="b-image" src="screenshots/b-home-390.png" alt="캐릭터 중심 B 홈"></a></figure></main><footer class="note">실제 앱에 A/B 선택이 구현되어 있으며, 기본값은 현재 서비스 A입니다. 캡처의 리포트·인물은 검수용 합성 예시이고 실제 개인 분석이 아닙니다. 실제 트래픽 배정·전환 지표 수집·외부 배포는 진행하지 않았습니다.<br><a href="README.md">변경 범위와 검증 기록</a></footer><script>(()=>{const pick=document.getElementById('screen');let width=390;const labels={home:'홈',onboarding:'사주 입력',survey:'기질 검사',saju:'사주 풀이',fusion:'통합 풀이',consult:'용신상담',family:'가족',account:'마이'};function render(){for(const variant of ['a','b']){const url=`screenshots/${variant}-${pick.value}-${width}.png`;document.getElementById(variant+'-image').src=url;document.getElementById(variant+'-image').alt=`실제 서비스 ${variant.toUpperCase()} ${labels[pick.value]}`;document.getElementById(variant+'-link').href=url}document.getElementById('screens').classList.toggle('pc',width===1440);document.getElementById('mobile').setAttribute('aria-pressed',String(width===390));document.getElementById('pc').setAttribute('aria-pressed',String(width===1440))}pick.onchange=render;document.getElementById('mobile').onclick=()=>{width=390;render()};document.getElementById('pc').onclick=()=>{width=1440;render()}})();</script></body></html>
