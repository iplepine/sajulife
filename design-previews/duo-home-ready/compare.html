<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>sajulife · 로그인 전후 디자인 연결</title><style>*{box-sizing:border-box}body{margin:0;background:#eeedeb;color:#222;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;padding:32px}.head{max-width:1280px;margin:0 auto 26px}.head h1{font-size:25px;margin:0 0 10px;letter-spacing:-.8px}.head p{font-size:13px;color:#666;margin:0;line-height:1.6}.grid{max-width:1280px;margin:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}figure{margin:0;min-width:0}figcaption{font-size:16px;font-weight:600;margin-bottom:14px;letter-spacing:-.4px}figcaption small{display:block;font-size:12px;font-weight:400;color:#666;margin-top:7px;line-height:1.5}img{width:100%;display:block}footer{max-width:1280px;margin:22px auto 0;font-size:11px;color:#777;line-height:1.6}@media(max-width:800px){.grid{grid-template-columns:1fr;max-width:440px}.head,.grid,footer{max-width:440px}}@media(max-width:480px){body{padding:20px}.head h1{font-size:21px}}</style></head><body><div class="head"><h1>한 장의 표지에서, 두 해설자가 있는 속지로.</h1><p>흰 바탕 · 검정 궁서 제목 · 같은 구분선과 여백. 색은 캐릭터와 통합 버튼에 집중합니다.</p></div><div class="grid"><figure><figcaption>로그인 전 — 현재 화면 유지<small>실제 로그인 전 화면 캡처. 문구·서체·바탕을 바꾸지 않습니다.</small></figcaption><img src="unchanged-landing-390-viewport.png" alt="기존 흰 바탕과 검정 궁서체 로그인 전 화면"></figure><figure><figcaption>로그인 후 — 처음 시작하는 홈<small>손 없는 정면 캐릭터 · 두 색 버튼 · 현재 홈의 세 단계와 5탭</small></figcaption><a href="index.html"><img src="proposed-home-390-viewport.png" alt="흰 화면에 검정 궁서 제목과 정면 캐릭터가 있는 새 홈"></a></figure><figure><figcaption>이어서 보기 — 진행 중인 홈<small>같은 화면에서 버튼과 진행 상태가 이어집니다. 가상 상태 예시입니다.</small></figcaption><a href="index.html?state=tci"><img src="proposed-home-resume-390.png" alt="기질 검사 이어서 하기 버튼과 완료 사주 다시 보기 경로"></a></figure></div><footer>현재 앱을 직접 확인해 만든 적용용 디자인 프리뷰입니다. 로그인 전 실제 화면은 그대로이며, 새 홈은 제품 반영 전 시안입니다.</footer></body></html>
