<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사줄라이프 · 인물 이미지 유무 비교</title><style>*{box-sizing:border-box}body{margin:0;padding:30px;background:#eeedeb;color:#222;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}header{max-width:1260px;margin:0 auto 24px}h1{font-size:24px;letter-spacing:-.8px;margin:0 0 9px}header p{font-size:13px;color:#666;margin:0;line-height:1.6}.grid{max-width:1260px;margin:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}figure{margin:0;min-width:0}figcaption{font-size:16px;font-weight:600;margin:0 0 13px}figcaption p{font-size:12px;color:#666;font-weight:400;line-height:1.5;margin:8px 0 0}img{display:block;width:100%}footer{max-width:1260px;margin:19px auto 0;font-size:11px;color:#777;line-height:1.7}@media(max-width:800px){.grid{grid-template-columns:1fr;max-width:440px}header,footer{max-width:440px}}@media(max-width:480px){body{padding:20px}h1{font-size:21px}}</style></head><body><header><h1>같은 홈, 인물 이미지가 주는 차이</h1><p>로그인 전 궁서 화면은 고정. 로그인 후 홈의 문구·버튼·기능은 같게 두고 이미지 유무만 비교했습니다.</p></header><div class="grid"><figure><figcaption>로그인 전 · 유지<p>대표 결정대로 흰 바탕과 검정 궁서체 유지.</p></figcaption><img src="unchanged-landing-390-viewport.png" alt="현재 로그인 전 화면"></figure><figure><figcaption>로그인 후 · 인물 있음<p>누가 말하는지 보이는 첫 홈. 반말과 두 역할이 연결됩니다.</p></figcaption><a href="index.html"><img src="proposed-home-390-viewport.png" alt="인물 이미지가 있는 로그인 후 홈"></a></figure><figure><figcaption>로그인 후 · 인물 없음<p>시작 버튼과 다른 풀이가 먼저 보이는 간결한 홈.</p></figcaption><a href="index.html?art=none"><img src="proposed-home-no-image-390.png" alt="인물 이미지가 없는 로그인 후 홈"></a></figure></div><footer>현재 화면을 바탕으로 만든 디자인 프리뷰입니다. 새 홈의 실제 제품 적용 전이며, 이미지 유무의 전환 성과는 아직 검증하지 않았습니다.</footer></body></html>
